about: >
  I'm a fourth-year PhD candidate in Industrial and Systems Engineering

  ([Lehigh ISE](https://engineering.lehigh.edu/ise)) at Lehigh University,
  advised by

  Professor Akwum Onwunta. My dissertation, *PDEs and Machine Learning with
  Applications

  in Medical Imaging*, develops optimization and deep learning methods for
  inverse

  problems and imaging.


  Before Lehigh, I earned a Master's degree in Mathematical Sciences from the
  African

  Institute for Mathematical Sciences ([AIMS](https://aims.ac.rw/)) in Rwanda,
  and a

  Bachelor's degree in Pure and Applied Mathematics from Ladoke Akintola
  University of

  Technology ([LAUTECH](https://www.lautech.edu.ng/undergraduate-programmes)) in

  Ogbomoso, Nigeria.


  I served as President of the

  [Lehigh INFORMS Student
  Chapter](https://www.linkedin.com/company/lehigh-informs-student-chapter/)

  for 2025&ndash;2026, and as Vice President and Treasurer of the

  [Lehigh University Graduate Association of Nigerian
  Students](https://www.linkedin.com/company/nigerian-club-lehigh-university/).
