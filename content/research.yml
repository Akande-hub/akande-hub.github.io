intro: >-
  My work sits at the intersection of mathematical optimization, machine learning, and
  partial differential equations &mdash; in particular, optimization methods with provable
  guarantees and their application to inverse problems and medical imaging.

interests:
  - Mathematical optimization &mdash; first- and second-order methods, momentum, convergence theory
  - Inverse problems &mdash; proximal methods, regularization, learned reconstruction
  - Machine learning &mdash; optimization for learning, deep learning for scientific problems
  - Partial differential equations and scientific computing
  - Medical imaging

