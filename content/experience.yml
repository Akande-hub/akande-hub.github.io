research:
  - title: Graduate Research Assistant &mdash; [Industrial and Systems
      Engineering](https://engineering.lehigh.edu/ise), Lehigh University
    meta: 2023 &ndash; present &middot; Advised by Prof. Akwum Onwunta
    detail: My dissertation, *PDEs and Machine Learning with Applications in Medical
      Imaging*, develops optimization methods with provable guarantees and
      applies them to inverse problems and imaging. Current work learns proximal
      operators with input-convex neural networks and connects them to
      Hamilton&ndash; Jacobi equations, giving a route to reconstruction that
      avoids solving an optimization problem at every query. An ongoing project
      carries these ideas into medical image registration, studying
      plug-and-play (PnP) algorithms for deformable image registration in which
      the regularizer is supplied by a learned proximal network (LPN), i.e., a
      neural network that is, by construction, the exact proximal operator of a
      (possibly nonconvex) learned regularization functional.
